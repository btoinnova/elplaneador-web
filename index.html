<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Planeador — Próximamente</title>
<meta name="description" content="El Planeador: un lugar para comparar y elegir bien tus planes de salud, seguros y más. Muy pronto.">
<link rel="icon" type="image/svg+xml" href="logo-planeador.svg">
<style>
  :root{--marino:#12284A;--oro:#B8893B;--fondo:#F4F6F8;--gris:#4E5A6C}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--fondo);color:var(--marino);font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
  .logo{width:min(150px,40vw);height:auto}
  .nombre{font-size:clamp(30px,6vw,44px);margin:18px 0 0;font-weight:800;letter-spacing:-.01em}
  h1{font-size:clamp(20px,4vw,26px);margin:14px 0 8px;font-weight:600}
  p{margin:0 0 6px;color:var(--gris);max-width:30em}
  .pill{display:inline-block;margin-top:22px;padding:8px 18px;border-radius:999px;background:var(--oro);color:#fff;font-weight:700;font-size:15px}
  .contacto{margin-top:26px;font-size:16px}
  a{color:var(--marino);text-decoration-color:var(--oro);text-underline-offset:3px}
  footer{padding:20px 24px 28px;display:flex;justify-content:center}
  .by{display:flex;align-items:center;gap:.5em}
  .by span{font:400 16px system-ui,sans-serif;color:var(--gris)}
  .by img{height:40px;width:auto}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo-planeador.svg" alt="El Planeador">
  <div class="nombre">El Planeador</div>
  <h1>Muy pronto</h1>
  <p>Estamos preparando un lugar para comparar y elegir bien tus planes de salud, seguros y más.</p>
  <span class="pill">Próximamente</span>
  <p class="contacto">Escríbenos a <a href="mailto:contacto@elplaneador.cl">contacto@elplaneador.cl</a></p>
</main>
<footer>
  <div class="by"><span>by</span><img src="bto-logo.png" alt="BTo Innova soluciones"></div>
</footer>
</body>
</html>
